name: release

# v* タグを push すると、exe・インストーラ・SHA256 を作って GitHub Release に添付する。
# 手動実行（workflow_dispatch）では Release は作らず、成果物を artifact として残す。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン（例: 1.0.0）"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: バージョンを決める
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version = $v"
          if ("${{ github.event_name }}" -eq "push") {
            $tag = (Get-Content src/enter_router/__init__.py | Select-String '__version__').ToString()
            Write-Host "package: $tag"
          }

      - name: バージョンをコードへ入れる
        shell: pwsh
        run: |
          # タグと exe の --version を必ず一致させる（手で 2 か所直さない）
          $file = "src/enter_router/__init__.py"
          $text = Get-Content $file -Raw
          $new = $text -replace '__version__ = "[^"]+"', ('__version__ = "' + "${{ steps.v.outputs.version }}" + '"')
          Set-Content -Path $file -Value $new -NoNewline
          Select-String -Path $file -Pattern "__version__"

      - name: PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: TSF テキストサービスをビルド
        run: cmd /c tsf\build.bat

      - name: Windows バージョンリソース
        run: python packaging\make_version_info.py ${{ steps.v.outputs.version }}

      - name: exe（onedir・2 本）
        run: pyinstaller --noconfirm --clean packaging\PechiPechiEnter.spec

      - name: ポータブル zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PechiPechiEnter/* `
            -DestinationPath "dist/PechiPechiEnter-${{ steps.v.outputs.version }}-win64.zip"

      - name: インストーラ
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe が見つかりません（runner イメージの InnoSetup 同梱が変わった可能性）" }
          & $iscc "/DMyAppVersion=${{ steps.v.outputs.version }}" "packaging\PechiPechiEnter.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: SHA256
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter "PechiPechiEnter-*" -File |
                   Where-Object { $_.Extension -in ".exe", ".zip" }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $h, $f.Name
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: 成果物を残す（手動実行時）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PechiPechiEnter-${{ steps.v.outputs.version }}
          path: |
            dist/PechiPechiEnter-*.exe
            dist/PechiPechiEnter-*.zip
            dist/SHA256SUMS.txt

      - name: Release を作る
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/PechiPechiEnter-Setup-${{ steps.v.outputs.version }}.exe" `
            "dist/PechiPechiEnter-${{ steps.v.outputs.version }}-win64.zip" `
            "dist/SHA256SUMS.txt" `
            --title "ぺちぺちエンター ${{ steps.v.outputs.version }}" `
            --generate-notes
